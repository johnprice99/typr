appId: com.johnprice.typr
productName: Typr
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  # Icon Composer icon: macOS switches it for light, dark and tinted icon
  # styles everywhere (Dock, Finder, Launchpad). Compiled with Xcode's actool;
  # build/icon.icns is the fallback for older macOS.
  icon: build/Typr.icon
  category: public.app-category.productivity
  target:
    - dmg
  # Signed ad hoc (free, no Apple account) so macOS knows the app as
  # com.johnprice.typr, e.g. when remembering Documents folder access.
  # Replace "-" with a Developer ID certificate to distribute.
  identity: '-'
  # Hardened runtime is only needed for Apple notarisation; with ad-hoc signing
  # it blocks Electron's own (differently signed) frameworks from loading.
  hardenedRuntime: false
  # Typr is in English, so Chromium's other ~200 languages (about 50 MB) aren't shipped.
  electronLanguages: [en, en_GB]
dmg:
  # A fixed name, so the website's download link (the newest release's
  # Typr-mac-arm64.dmg) keeps working from one version to the next.
  artifactName: ${productName}-mac-arm64.${ext}
  # Typr has its own updater, so electron-builder's update files (latest-mac.yml
  # and .blockmap) aren't needed.
  writeUpdateInfo: false
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    role: Editor
    rank: Alternate
  - ext: txt
    name: Plain Text Document
    role: Editor
    rank: Alternate
